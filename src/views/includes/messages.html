<% if(errors && errors.length !== 0) { %>
<div class="row">
  <div class="col my-2">
    <div class="alert alert-danger">
      <% errors.forEach(erro => { %> <%= erro %><br />
      <% }); %>
    </div>
  </div>
</div>
<% } %> <% if(success && success.length !== 0) { %>
<div class="row">
  <div class="col my-2">
    <div class="alert alert-success alert-dismissable fade show">
      <%= success %>
    </div>
  </div>
</div>
<% } %>
